<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Veterinária - Pets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho">
        <a href="principal.html" class="marca">🐾 Clínica Veterinária</a>
        <a href="principal.html">← Início</a>
    </header>

    <main>
        <h1>Pets</h1>

        <div class="caixa">
            <h2>Novo Pet</h2>
            <form id="form-pet">
                <div class="campos">
                    <div class="campo">
                        <label for="pet-nome">Nome</label>
                        <input type="text" id="pet-nome" required>
                    </div>
                    <div class="campo">
                        <label for="pet-especie">Espécie</label>
                        <select id="pet-especie" required>
                            <option value="">Selecione...</option>
                            <option value="Cão">Cão</option>
                            <option value="Gato">Gato</option>
                            <option value="Ave">Ave</option>
                            <option value="Roedor">Roedor</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="pet-raca">Raça</label>
                        <input type="text" id="pet-raca" placeholder="Ex: Labrador">
                    </div>
                    <div class="campo">
                        <label for="pet-tutor">Tutor</label>
                        <select id="pet-tutor" required>
                            <option value="">Carregando tutores...</option>
                        </select>
                    </div>
                </div>
                <div class="acoes-formulario">
                    <button type="submit">Cadastrar</button>
                </div>
            </form>
            <p id="mensagem-pet"></p>
        </div>

        <p id="mensagem-pets" class="texto-apagado">Carregando pets...</p>
        <table id="tabela-pets" class="escondido">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Espécie</th>
                    <th>Raça</th>
                    <th>Tutor</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-pets"></tbody>
        </table>
    </main>

    <script src="js/pets.js"></script>
</body>
</html>
